services:
  bros:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    image: bros:latest
    container_name: bros
    ports:
      - "${BROS_PORT:-3055}:${BROS_PORT:-3055}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BROS_HOST_DATA_DIR:-./data}:/app/data
      # Host path for bind (set by ./bros); inside container scan uses /host-home
      - ${BROS_HOST_HOME_BIND:-${HOME}}:/host-home:rw
      # Same path again so ~/.local/bin symlinks resolve inside the container.
      - ${BROS_HOST_HOME_BIND:-${HOME}}:${BROS_HOST_HOME_BIND:-${HOME}}:ro
      # Same host path inside the container so compose binds resolve on the engine.
      - ${BROS_HOST_REPO:-/opt/bros-repo}:${BROS_HOST_REPO:-/opt/bros-repo}:rw
      - ${BROS_CONFIG_HOST:-./data/config/bros.yml}:/app/bros.yml:ro
      - bros-x11:/var/run/bros-x11:ro
    environment:
      BROS_DIR: /app
      BROS_HOST_REPO: ${BROS_HOST_REPO:-}
      BROS_SIDECARS_DISABLE: ${BROS_SIDECARS_DISABLE:-}
      BROS_SIDECAR_OPENCODE: ${BROS_SIDECAR_OPENCODE:-0}
      BROS_SIDECAR_OPENWEBUI: ${BROS_SIDECAR_OPENWEBUI:-}
      BROS_SIDECAR_FIRECRAWL: ${BROS_SIDECAR_FIRECRAWL:-}
      BROS_SIDECAR_FIRECRAWL_UI: ${BROS_SIDECAR_FIRECRAWL_UI:-}
      BROS_SIDECAR_OPENJEV: ${BROS_SIDECAR_OPENJEV:-}
      BROS_SIDECAR_PI: ${BROS_SIDECAR_PI:-}
      BROS_SIDECAR_OMNIROUTE: ${BROS_SIDECAR_OMNIROUTE:-}
      BROS_OMNIROUTE_PORT: ${BROS_OMNIROUTE_PORT:-}
      BROS_WHISPER_PORT: ${BROS_WHISPER_PORT:-}
      BROS_FIRECRAWL_PORT: ${BROS_FIRECRAWL_PORT:-}
      BROS_OPENJEV_PORT: ${BROS_OPENJEV_PORT:-}
      BROS_FIRECRAWL_POSTGRES_PASSWORD: ${BROS_FIRECRAWL_POSTGRES_PASSWORD:-}
      BROS_HOST_DATA_DIR: ${BROS_HOST_DATA_DIR:-}
      BROS_HOST_UID: ${BROS_HOST_UID:-1000}
      BROS_HOST_GID: ${BROS_HOST_GID:-1000}
      BROS_DOCKER_GID: ${BROS_DOCKER_GID:-0}
      BROS_HOST_HOME: /host-home
      BROS_HOST_HOME_BIND: ${BROS_HOST_HOME_BIND:-${HOME}}
      BROS_OLLAMA_MODELS_DIR: /app/data/home/.ollama/models
      BROS_PORT: ${BROS_PORT:-3055}
      BROS_HOST: ${BROS_HOST:-0.0.0.0}
      BROS_DEVBOX_VERSION: ${BROS_DEVBOX_VERSION:-0.18.4}
      BROS_DEV: ${BROS_DEV:-}
      BROS_DAEMON: ${BROS_DAEMON:-}
      BROS_HOME: ${BROS_HOME:-}
      BROS_BIN: ${BROS_BIN:-}
      BROS_CONFIG_HOST: ${BROS_CONFIG_HOST:-}
      BROS_PUBLIC_URL: ${BROS_PUBLIC_URL:-}
      BROS_WORKING_DIR: ${BROS_WORKING_DIR:-}
      BROS_OLLAMA_PORT: ${BROS_OLLAMA_PORT:-11435}
      BROS_NETWORK: ${BROS_NETWORK:-bros}
      BROS_HOST_GATEWAY: ${BROS_HOST_GATEWAY:-host.docker.internal}
      BROS_TUNNEL_HOST: ${BROS_TUNNEL_HOST:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bros
    restart: unless-stopped
    # Host UID/GID so bind-mount writes (.nuxt, caches) are not root-owned on the host.
    user: "${BROS_HOST_UID:-1000}:${BROS_HOST_GID:-1000}"
    # Sock is 660 root:docker on this host — docker group GID, not root group 0.
    group_add:
      - "${BROS_DOCKER_GID:-0}"

networks:
  bros:
    name: bros
    external: true

volumes:
  bros-x11:
    name: bros-x11
    external: true

