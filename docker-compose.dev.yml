services:
  bros:
    build:
      target: development
    image: bros:dev
    volumes:
      - ./:/app
      - bros-node-modules:/app/src/node_modules
      - bros-app-modules:/app/src/ui/node_modules
      - bros-docs-layer-modules:/app/src/layers/docs/node_modules
      - bros-theme-modules:/app/src/layers/theme/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
      BROS_DEV: "1"

volumes:
  bros-node-modules:
  bros-app-modules:
  bros-docs-layer-modules:
  bros-theme-modules:
