id: ollama
slug: ollama
name: Ollama
description: Local model runtime. Bros publishes host port 11435. Independent of the Bros app container. Compose sets OLLAMA_NOPRUNE=1 so incomplete pulls are not pruned.

interfaces:
  - type: api
    service: ollama
    containerPort: 11434
    publish: 11435
    basePath: /api
  - type: openai
    service: ollama
    containerPort: 11434
    publish: 11435
    basePath: /v1
