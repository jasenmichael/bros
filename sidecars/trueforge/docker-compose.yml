# Custom pack — candidate for lib/sidecars/addon later.
# Upstream: https://github.com/truefoundry/trueforge
# Image: local build of npm @truefoundry/trueforge@0.3.1 (standalone SQLite).
# UI at /. No proxy.public (standalone has no login).
services:
  trueforge:
    build: .
    image: bros-trueforge:0.3.1
    environment:
      HOST: 0.0.0.0
      PORT: "8790"
      STANDALONE: "true"
      SQLITE_PATH: /data/db.sqlite
      PUBLIC_BASE_URL: http://127.0.0.1:${BROS_TRUEFORGE_PORT:-8791}
    ports:
      - "${BROS_TRUEFORGE_PORT:-8791}:8790"
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/trueforge:/data
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
