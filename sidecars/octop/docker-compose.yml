# Custom pack — candidate for lib/sidecars/addon later.
# Upstream: https://github.com/TencentCloud/Octop
# Image: ghcr.io/tencentcloud/octop
services:
  octop:
    image: ${OCTOP_IMAGE:-ghcr.io/tencentcloud/octop:latest}
    environment:
      HOME: /data
      OCTOP_BIND_HOST: "0.0.0.0"
      OCTOP_PORT: "8088"
      OCTOP_LOG_LEVEL: ${OCTOP_LOG_LEVEL:-info}
      # Unset = random password written to /data/.octop/credential.txt on first init.
      OCTOP_DEFAULT_PASSWORD: ${OCTOP_DEFAULT_PASSWORD:-}
      OCTOP_ADMIN_USERNAME: ${OCTOP_ADMIN_USERNAME:-admin}
      OCTOP_ADMIN_DISPLAY_NAME: ${OCTOP_ADMIN_DISPLAY_NAME:-Admin}
      OCTOP_DATABASE_URL: ${OCTOP_DATABASE_URL:-}
      OCTOP_DATABASE_DRIVER: ${OCTOP_DATABASE_DRIVER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "${BROS_OCTOP_PORT:-8088}:8088"
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/octop/data/.octop:/data/.octop
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
