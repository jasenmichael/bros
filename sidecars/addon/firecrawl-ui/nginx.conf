# Same-origin API so the browser (and Cursor preview) never cross-port to :3002.
# Docker DNS 127.0.0.11; resolve at request time in case Firecrawl is down at nginx start.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    location /v2/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $firecrawl_upstream firecrawl:3002;
        proxy_pass http://$firecrawl_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /v0/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $firecrawl_upstream firecrawl:3002;
        proxy_pass http://$firecrawl_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
