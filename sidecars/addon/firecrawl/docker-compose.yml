# Self-host contract: Firecrawl v2.11.162 (https://docs.firecrawl.dev/contributing/self-host).
# Images instead of building the firecrawl repo. API tag 2.11.162; playwright/nuq GHCR :latest.
# Auth off. Postgres queue. No FoundationDB. No queue-admin UI. Playwright :3000 is internal only.
services:
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    restart: unless-stopped
    networks:
      - firecrawl

  redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/firecrawl-redis:/data
    restart: unless-stopped
    networks:
      - firecrawl

  rabbitmq:
    image: rabbitmq:3
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/firecrawl-rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - firecrawl

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${BROS_FIRECRAWL_POSTGRES_PASSWORD:-bros-firecrawl-local-trusted-network-only-32b}"
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/firecrawl-pg:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - firecrawl

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:2.11.162
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      ENV: local
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${BROS_FIRECRAWL_POSTGRES_PASSWORD:-bros-firecrawl-local-trusted-network-only-32b}"
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: "5432"
      USE_DB_AUTHENTICATION: "false"
      # Allow scrape/webhook of localhost and RFC1918 (Bros on the host).
      ALLOW_LOCAL_WEBHOOKS: "true"
      TEST_SUITE_SELF_HOSTED: "true"
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      OLLAMA_BASE_URL: http://ollama:11434
      NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
      CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
    command: node dist/src/harness.js --start-docker
    ports:
      - "${BROS_FIRECRAWL_PORT:-3002}:3002"
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_started
    restart: unless-stopped
    networks:
      - firecrawl
      - bros

networks:
  firecrawl:
    driver: bridge
  bros:
    external: true
