# Bros GPU override for Ollama (merged when provider config.useGpu is true)
services:
  ollama:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/bros-model:/bros-model:ro
