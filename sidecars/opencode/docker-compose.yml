services:
  opencode:
    image: ghcr.io/anomalyco/opencode
    # ENTRYPOINT is opencode; web UI must stay in foreground for container lifetime.
    command: ["web", "--hostname", "0.0.0.0", "--port", "4096"]
    working_dir: /workspace
    ports:
      - "${BROS_OPENCODE_PORT:-4097}:4096"
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/opencode:/workspace
      - ${BROS_HOST_DATA_DIR:?unset}/opencode-config:/root/.config/opencode
      - ${BROS_HOST_DATA_DIR:?unset}/opencode-share:/root/.local/share/opencode
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
