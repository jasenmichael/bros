# Custom pack — candidate for lib/sidecars/addon later.
# Upstream: https://github.com/OpenHands/OpenHands (Agent Canvas)
# Image: ghcr.io/openhands/agent-canvas (Docker UI at /canvas)
services:
  openhands:
    image: ${OPENHANDS_IMAGE:-ghcr.io/openhands/agent-canvas:latest}
    environment:
      # Optional: require key entry in the UI (self-host / shared hosts).
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:-}
      # LLM keys can also be set in the Agent Canvas UI.
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${BROS_OPENHANDS_PORT:-8000}:8000"
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/openhands/home/openhands/.openhands:/home/openhands/.openhands
      - ${BROS_HOST_DATA_DIR:?unset}/openhands/projects:/projects
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
