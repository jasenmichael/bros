# Custom pack — candidate for lib/sidecars/addon later.
# Upstream: https://github.com/paperclipai/paperclip
# Image: ghcr.io/paperclipai/paperclip (:latest = stable)
services:
  paperclip:
    image: ${PAPERCLIP_IMAGE:-ghcr.io/paperclipai/paperclip:latest}
    pids_limit: 2048
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      PAPERCLIP_HOME: /paperclip
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # LAN Bros sidecar: skip login. Switch to authenticated + BETTER_AUTH_SECRET for shared hosts.
      PAPERCLIP_DEPLOYMENT_MODE: ${PAPERCLIP_DEPLOYMENT_MODE:-local_trusted}
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_DEPLOYMENT_EXPOSURE:-private}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://127.0.0.1:3100}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    ports:
      - "${BROS_PAPERCLIP_PORT:-3100}:3100"
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/paperclip/paperclip:/paperclip
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
