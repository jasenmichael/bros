name: Fast-forward development

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  checks: write

jobs:
  fast-forward:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'development'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward development to main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin main development
          git checkout -B main origin/main
          if ! git merge-base --is-ancestor origin/development origin/main; then
            echo "stop: development cannot fast-forward to main"
            exit 0
          fi
          sha="$(git rev-parse origin/main)"
          for ctx in js rust; do
            ok="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=${ctx}" --jq '[.check_runs[] | select(.conclusion=="success")] | length')"
            if [[ "$ok" == "0" ]]; then
              echo "stop: ${ctx} did not pass on ${HEAD_SHA}"
              exit 1
            fi
          done
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for ctx in js rust; do
            have="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=${ctx}" --jq '[.check_runs[] | select(.conclusion=="success")] | length')"
            if [[ "$have" == "0" ]]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
                -f name="$ctx" \
                -f head_sha="$sha" \
                -f status="completed" \
                -f conclusion="success" \
                -f started_at="$now" \
                -f completed_at="$now"
            fi
          done
          set +e
          git push origin main:development >push.err 2>&1
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            cat push.err
            if grep -q 'non-fast-forward' push.err; then
              echo "stop: development cannot fast-forward to main"
              exit 0
            fi
            exit "$code"
          fi
          echo "fast-forwarded development to main"
