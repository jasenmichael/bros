name: Ensure development PR

on:
  push:
    branches: [development]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure:
    runs-on: ubuntu-24.04
    steps:
      - name: Open development into main when missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          owner="$GITHUB_REPOSITORY_OWNER"
          open="$(gh pr list --repo "$repo" --base main --head "${owner}:development" --state open --json number --jq 'length')"
          if [[ "$open" != "0" ]]; then
            echo "development into main pull request already open"
            exit 0
          fi
          ahead="$(gh api "repos/${repo}/compare/main...development" --jq '.ahead_by')"
          if [[ "$ahead" == "0" ]]; then
            echo "development is not ahead of main; no pull request"
            exit 0
          fi
          gh pr create \
            --repo "$repo" \
            --base main \
            --head development \
            --title "Release: development into main" \
            --body "Changes on development that are ready to release. Merging this pull request into main publishes the release. Automation does not approve it and does not merge it."
