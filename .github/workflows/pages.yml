name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/website/**'
      - 'src/layers/**'
      - 'docs/**'
      - 'src/package.json'
      - 'src/pnpm-lock.yaml'
      - 'src/pnpm-workspace.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v5
        with:
          # Same Node as the ui image so better-sqlite3 loads.
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: src
      - run: pnpm --filter @bros/website generate
        working-directory: src
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/website/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
