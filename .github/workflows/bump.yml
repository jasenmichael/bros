name: Bump

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bump on the pull request branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          cur="$(tr -d '[:space:]' < VERSION)"
          if [[ "$HEAD_REF" == "development" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "Release: development into main"
          fi
          if ! git ls-remote --tags origin "refs/tags/v${cur}" | grep -q .; then
            echo "bump: tag v${cur} missing; leave VERSION for first release"
            exit 0
          fi
          want="$(scripts/bump-type.sh origin/main)"
          if [[ -z "$want" ]]; then
            echo "bump: no feat/fix/perf/breaking on branch; skip"
            exit 0
          fi
          rank() {
            case "$1" in
              major) printf '3\n' ;;
              minor) printf '2\n' ;;
              patch) printf '1\n' ;;
              *) printf '0\n' ;;
            esac
          }
          have="$(git log origin/main..HEAD --format=%s | grep -m1 '^chore: bump ' || true)"
          if [[ -n "$have" ]]; then
            have_type="$(printf '%s\n' "$have" | awk '{print $3}')"
            if [[ "$(rank "$want")" -le "$(rank "$have_type")" ]]; then
              echo "bump: already have ${have}; skip"
              exit 0
            fi
          fi
          echo "bump: ${want} from ${cur}"
          scripts/bump.sh "$want"
          if [[ "$HEAD_REF" == "main" ]]; then
            echo "refuse: will not push a bump to main"
            exit 1
          fi
          if [[ "$HEAD_REF" == "development" ]]; then
            sha="$(git rev-parse HEAD)"
            git push origin "HEAD:refs/heads/bump/${sha}"
            exit 0
          fi
          git push origin "HEAD:${HEAD_REF}"
