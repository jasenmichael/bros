# Apt packages baked into the desktop image. Not rows on /settings/desktop.
# clis: main command, then extra commands, comma-separated.
packages:
  - name: bash
    clis: bash
  - name: ca-certificates
  - name: curl
    clis: curl
  - name: wget
    clis: wget
  - name: git
    clis: git
  - name: python3
    clis: python3
  - name: python-is-python3
    clis: python
  - name: xz-utils
    clis: xz, xzcat, unxz, lzma
  - name: unzip
    clis: unzip, funzip, unzipsfx, zipgrep, zipinfo
  # Electron/GTK Open Folder and friends. Session start: bros-portals.sh.
  - name: xdg-desktop-portal
  - name: xdg-desktop-portal-gtk
  - name: xdg-desktop-portal-wlr
  - name: dbus-x11
    clis: dbus-launch, dbus-daemon
  - name: zenity
    clis: zenity
  # Adwaita-dark for portal FileChooser (matches Cursor dark).
  - name: gnome-themes-extra-data
