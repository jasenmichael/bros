# Desktop runtime. Selkies Wayland, package apps, and the terminal. No host port.
services:
  desktop:
    build:
      context: ${BROS_HOST_DATA_DIR:?unset}/build/desktop
      dockerfile: Dockerfile
      args:
        BROS_DEVBOX_VERSION: ${BROS_DEVBOX_VERSION:-0.18.4}
      additional_contexts:
        sidecars: ${BROS_HOST_REPO:?unset}/lib/sidecars
        brosnode: docker-image://${BROS_APP_IMAGE:-bros:latest}
    image: bros-desktop
    container_name: bros-desktop
    hostname: bros
    group_add:
      - "${BROS_DOCKER_GID:-0}"
    shm_size: "1gb"
    stdin_open: true
    tty: true
    working_dir: /home/bros/workspace
    environment:
      PUID: "${BROS_HOST_UID:-1000}"
      PGID: "${BROS_HOST_GID:-1000}"
      HOME: /home/bros
      XDG_DATA_HOME: /home/bros/.local/share
      XDG_STATE_HOME: /home/bros/.local/state
      XDG_CACHE_HOME: /home/bros/.cache
      XDG_CONFIG_HOME: /home/bros/.config
      PIXELFLUX_WAYLAND: "true"
      SELKIES_MODE: websockets
      SUBFOLDER: /desktop/view/
      PATH: /home/bros/.local/share/devbox/global/default/.devbox/nix/profile/default/bin:/home/bros/.nix-profile/bin:/home/bros/.cargo/bin:/home/bros/.local/sidecar-bins:/home/bros/.local/bin:/home/bros/.local/devbox-bin:/home/bros/.local/share/pnpm:/home/bros/.bun/bin:/home/bros/.deno/bin:/lsiopy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      BROS_NODE_VERSION: ${BROS_NODE_VERSION:-26.7.0}
      npm_config_prefix: /home/bros/.local
      PNPM_HOME: /home/bros/.local/share/pnpm
      npm_config_store_dir: /home/bros/.local/share/pnpm/store
      BUN_INSTALL: /home/bros/.bun
      DENO_INSTALL_ROOT: /home/bros/.deno
      DENO_DIR: /home/bros/.deno/cache
      UV_CACHE_DIR: /home/bros/.cache/uv
      CARGO_HOME: /home/bros/.cargo
      BROS_HOST_DATA_DIR: ${BROS_HOST_DATA_DIR:?unset}
      BROS_HOST_REPO: ${BROS_HOST_REPO:?unset}
      BROS_HOST_UID: ${BROS_HOST_UID:-1000}
      BROS_HOST_GID: ${BROS_HOST_GID:-1000}
      BROS_DOCKER_GID: ${BROS_DOCKER_GID:-0}
      TZ: Etc/UTC
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/config/apps:/opt/bros/apps
      - ${BROS_HOST_DATA_DIR:?unset}/home:/home/bros
      - ${BROS_HOST_DATA_DIR:?unset}/home/nix:/nix
      - ${BROS_HOST_DATA_DIR:?unset}/cache/apt/archives:/var/cache/apt/archives
      - ${BROS_HOST_DATA_DIR:?unset}/cache/apt/lists:/var/lib/apt/lists
      - ${BROS_HOST_DATA_DIR:?unset}/cache/deb:/var/cache/bros/debs
      - ${BROS_HOST_DATA_DIR:?unset}/var/logs:/var/log/bros
      - ${BROS_HOST_WORKSPACE:?unset}:/home/bros/workspace
      - ${BROS_HOST_REPO:?unset}:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - bros-x11:/tmp/.X11-unix
      - bros-run:/tmp/bros-run
      - ${BROS_HOST_REPO:?unset}/lib/sidecars/core/desktop/root/custom-cont-init.d/bros-live:/custom-cont-init.d/bros-live:ro
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true

volumes:
  bros-x11:
    name: bros-x11
    external: true
  bros-run:
    name: bros-run
    external: true
