services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${BROS_OLLAMA_PORT:-11435}:11434"
    environment:
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/ollama/root/.ollama:/root/.ollama
      - ${BROS_HOST_DATA_DIR:?unset}/ollama/root/.config/ollama:/root/.config/ollama
      - ${BROS_HOST_DATA_DIR:?unset}/ollama/bros-model:/bros-model:ro
      # Same host path as app so symlink imports resolve inside Ollama
      - ${BROS_HOST_HOME_BIND:-${HOME}}:/host-home:ro
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
