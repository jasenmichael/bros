services:
  ollama:
    image: ollama/ollama:0.40.10@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35
    user: "${BROS_HOST_UID:-1000}:${BROS_HOST_GID:-1000}"
    ports:
      - "${BROS_OLLAMA_PORT:-11435}:11434"
    environment:
      HOME: /home/bros
      OLLAMA_NOPRUNE: "1"
    tmpfs:
      - /home/bros:mode=1777
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/home/.ollama:/home/bros/.ollama
      - ${BROS_HOST_DATA_DIR:?unset}/home/.config/ollama:/home/bros/.config/ollama
      - ${BROS_HOST_DATA_DIR:?unset}/sidecars/ollama/bros-model:/bros-model:ro
      # Same host path as app so symlink imports resolve inside Ollama
      - ${BROS_HOST_HOME_BIND:-${HOME}}:/host-home:ro
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
