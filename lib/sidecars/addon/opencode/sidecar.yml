id: opencode
slug: opencode
name: OpenCode
description: CLI coding agent with web UI (anomalyco/opencode). Bros publishes host port 4097.

home:
  - .config/opencode
  - .local/share/opencode
  - .local/state/opencode

interfaces:
  - type: cli
    service: opencode
    command: opencode
  - type: webui
    service: opencode
    containerPort: 4096
    publish: 4097
    slug: opencode
