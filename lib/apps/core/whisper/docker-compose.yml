services:
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
    user: "${BROS_HOST_UID:-1000}:${BROS_HOST_GID:-1000}"
    environment:
      HOME: /home/bros
      HF_HOME: /home/bros/.cache/huggingface
      WHISPER__MODEL: Systran/faster-whisper-base
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__INFERENCE_DEVICE: cpu
      STT_MODEL_TTL: "-1"
      ENABLE_UI: "false"
      PRELOAD_MODELS: '["Systran/faster-whisper-base"]'
    ports:
      - "${BROS_WHISPER_PORT:-8090}:8000"
    tmpfs:
      - /home/bros:mode=1777
    volumes:
      - ${BROS_DATA_DIR:?unset}/home/.cache/huggingface/hub:/home/bros/.cache/huggingface/hub
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
