id: opencode
name: OpenCode
description: CLI coding agent. Off until enabled.
kind: npm
spec: "@opencode/cli"
bin: opencode
interfaces:
  - type: cli
    command: opencode
  - type: webui
    containerPort: 4096
    publish: 4097
services:
  - command: opencode serve --hostname 0.0.0.0 --port 4096
    cwd: /home/bros
