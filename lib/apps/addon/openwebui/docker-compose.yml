services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    user: "${BROS_HOST_UID:-1000}:${BROS_HOST_GID:-1000}"
    environment:
      # start.sh writes this next to itself in /app/backend. That dir is root-owned.
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      WEBUI_AUTH: "false"
      OLLAMA_BASE_URL: http://ollama:11434
      # Public URL for callbacks; browser hits published host port
      WEBUI_URL: http://localhost:3080
    ports:
      - "${BROS_OPENWEBUI_PORT:-3080}:8080"
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/apps/openwebui/data:/app/backend/data
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
