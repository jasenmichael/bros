# Pi — https://pi.dev/docs/latest/quickstart
# Addon. Node 22. No published port.
# Disable autostart with BROS_APP_PI=0.
services:
  pi:
    build: .
    image: bros-pi
    user: "${BROS_HOST_UID:-1000}:${BROS_HOST_GID:-1000}"
    working_dir: /home/bros/workspace
    stdin_open: true
    tty: true
    environment:
      HOME: /home/bros
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    tmpfs:
      - /home/bros:mode=1777
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/home/.pi:/home/bros/.pi
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
