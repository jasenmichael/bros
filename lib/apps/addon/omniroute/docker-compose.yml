# OmniRoute — https://github.com/diegosouzapw/OmniRoute
# Dashboard and /v1 share port 20128. Provider keys and combos are not in this file.
services:
  omniroute-redis:
    image: docker.io/library/redis:8.6.5-alpine
    user: "${BROS_HOST_UID:-1000}:${BROS_HOST_GID:-1000}"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/sidecars/omniroute/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bros

  omniroute:
    image: diegosouzapw/omniroute:3.8.52
    user: "${BROS_HOST_UID:-1000}:${BROS_HOST_GID:-1000}"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      REDIS_URL: redis://omniroute-redis:6379
      REQUIRE_API_KEY: "true"
      OMNIROUTE_MEMORY_MB: "2048"
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:-}
    ports:
      - "${BROS_OMNIROUTE_PORT:-20128}:20128"
    volumes:
      - ${BROS_HOST_DATA_DIR:?unset}/sidecars/omniroute/data:/app/data
    depends_on:
      omniroute-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bros

networks:
  bros:
    external: true
